name: LAB-4T build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python deps
        run: pip3 install Pillow fonttools
      - name: JieLi toolchain
        run: tools/get_toolchain.sh
      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
      - name: Firmware
        run: ./build.sh
      - name: Host tests (the sound must not change)
        run: sh tests/ci_quick.sh
        continue-on-error: true
      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Browser emulator
        run: sh web/emu/build.sh
      - name: Site (installer, editor, firmware)
        run: |
          VER=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -n 1)
          python3 web/make_site.py build/felucca.fwsc "$VER" _site
          mkdir -p _site/webapp/try
          cp -r build/emu/. _site/webapp/try/
      - uses: actions/upload-artifact@v4
        with:
          name: felucca-firmware
          path: |
            build/*.fwsc
            build/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
